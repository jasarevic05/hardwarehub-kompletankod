name: Automatski Deploy na Netlify

on:
  push:
    branches:
      - main  # Ako vam se glavna grana zove 'master', promijenite ovo u master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Preuzmi kod sa GitHuba
        uses: actions/checkout@v4

      - name: Instaliraj Netlify CLI alat
        run: npm install -g netlify-cli

      - name: Gurni sajt na Netlify Live Production
        run: netlify deploy --dir=. --prod
        env:
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
